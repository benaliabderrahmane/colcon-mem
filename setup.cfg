[metadata]
name = colcon-mem
version = 0.1.0
url = https://github.com/benaliabderrahmane/colcon-mem
author = Abderahmane BENALI
author_email = abderahmane.benali@exail.com
maintainer = Abderahmane BENALI
maintainer_email = abderahmane.benali@exail.com
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Plugins
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Topic :: Software Development :: Build Tools
license = Apache License, Version 2.0
description = Extension for colcon to limit the parallelism by available memory
long_description = file: README.md
long_description_content_type = text/markdown
keywords = colcon

[options]
python_requires = >=3.6
install_requires =
    colcon-core>=0.19.0
    colcon-parallel-executor
packages = find:
zip_safe = true

[options.extras_require]
test =
    flake8
    pytest

[options.packages.find]
exclude = test

[options.entry_points]
colcon_core.executor =
    mem = colcon_mem.executor.mem:MemoryExecutorExtension

[flake8]
extend-ignore = D100,D103,D104
import-order-style = google

[tool:pytest]
testpaths = test
